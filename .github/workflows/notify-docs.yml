name: Notify MonicaDocs

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: notify-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    name: Dispatch to MonicaDocs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只在主仓库触发；MonicaDocs 自身或 fork 的 push 不通知。
    if: github.repository == 'Monica-Pass/Monica-for-iOS'
    steps:
      - name: Check token
        id: token
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          if [ -z "$DOCS_REPO_TOKEN" ]; then
            echo "::warning::DOCS_REPO_TOKEN 未配置，跳过 MonicaDocs 通知。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch
        if: steps.token.outputs.skip == 'false'
        uses: actions/github-script@v8
        env:
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.DOCS_REPO_TOKEN }}
          script: |
            const isRelease = context.eventName === 'release';
            await github.rest.repos.createDispatchEvent({
              owner: 'Monica-Pass',
              repo: 'MonicaDocs',
              event_type: isRelease ? 'monica-release-published' : 'monica-main-updated',
              client_payload: {
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
                source_sha: context.sha,
                source_ref: context.ref,
                release_tag: isRelease ? (context.payload.release?.tag_name ?? '') : '',
              },
            });
            core.info(`Dispatched ${isRelease ? 'release' : 'main'} event for ${context.sha}`);
